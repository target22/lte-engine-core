# config/ui_projection.yaml
#
# TRI-PANE PROJECTION CONTRACT — the mapping from a parsed AST block to
# (a) which pane renders it and (b) which Layer 1/2/3 label it carries.
#
# KEYED ON INTERNAL ROLES, NOT AUTHORED TOKENS. The previous revision keyed
# `callout_kinds:` on `ref:`/`ops:` -- the tokens an author types. Those are
# now renameable in config/linter_rules.json#callout_kinds.aliases, so keying
# a layer table on them would move every label the moment somebody renamed a
# token. The keys below are the internal dependent roles
# (linter_rules.json#dependent_lifecycle.dependent_roles), which no config
# edit can rename.
#
# THE `admonitions:` BLOCK IS GONE with Grammar 2. Note that it was the only
# block validate_ui_projection() ever read: the old `callout_kinds:` block
# was dead config, and every Grammar-1 callout resolved its layer through the
# ADMONITION table (debate_layer_of -> layer_for("warning", ...)). Deleting
# the admonition block without the taxonomy.py patch in the same commit
# therefore removes layer resolution entirely, not just a legacy path.
#
# `graph_key` is the array name this role's entries occupy on a contract node
# in graph.json. `debates` and `ops` keep their historical names so app.js is
# unaffected; `evidence` is new and app.js does not read it yet.
#
# SCOPE OF THIS FILE — read this before assuming it drives the UI.
# The `layer` string emitted into graph.json is what this file controls, and
# that string IS consumed by the compiler (lte/engine/graph_builder.py, via
# Taxonomy.contract_layer_of / callout_layer_of). The `pane` field below is
# DESCRIPTIVE: public/app.js
# does not currently read `layer` at all — it selects panes from the nested
# document/node/debates/ops structure directly. Changing `pane` here therefore
# changes documentation, not rendering, until app.js is taught to read it.
# See 01-AUDIT-FINDINGS.md FINDING 5.

config_version: "1.0.0"

panes:
  left:
    role: structural_navigation
    renders: "Tier 1 partition -> Tier 2 tractate_path -> Tier 3 document tree"
    source_fields: ["partitions[].id", "partitions[].label", "documents[].tractate_path", "documents[].document_id"]
    notes: >-
      tractate_path is structural, not cosmetic: it is the real on-disk
      subfolder chain beneath docs/<scope>/<partition>/ and drives both the
      collapsible folder tree here and isolation-by-tractate in the middle pane.

  middle:
    role: contract_body
    renders: "Tier 4 contract nodes, plus prologue_html when node_count == 0"
    layers: ["KERNEL_CONTRACT", "POLICY_CONTRACT", "META_CONSTITUTION"]

  right:
    role: contextual_annotations
    renders: "Tier 4 debate, ops/checklist and evidence entries, nested under their target contract node"
    layers: ["TECHNICAL_DEBATE", "POLICY_DEBATE", "META_DEBATE",
             "OPERATIONAL_EXTENSIONS", "EXECUTION_CHECKLIST", "META_CHECKLIST",
             "TECHNICAL_EVIDENCE", "COMPLIANCE_EVIDENCE", "META_EVIDENCE"]

# Contract (Primary Key) nodes. `layer_by_flavor` is keyed on the `flavor`
# field of config/taxonomy.yaml. Every flavor declared there MUST appear in
# every layer_by_flavor map below; validate_ui_projection raises TaxonomyError
# otherwise, so adding a fourth flavor can never silently fall through.
node_projection:
  contract:
    pane: middle
    emits: node
    layer_by_flavor:
      kernel: KERNEL_CONTRACT
      policy: POLICY_CONTRACT
      # META_CONSTITUTION is the label the brief specified for the axioms
      # partition. Declared HERE, not in taxonomy.yaml, so that layer
      # strings have exactly one home.
      meta: META_CONSTITUTION

# Dependent (Foreign Key) blocks, keyed on INTERNAL ROLE. The authored token
# that resolves to each role lives in linter_rules.json#callout_kinds.aliases
# and is deliberately absent here -- one concept, one home.
callout_kinds:
  debate:
    graph_key: debates
    pane: right
    layer_by_flavor:
      kernel: TECHNICAL_DEBATE
      policy: POLICY_DEBATE
      # FLAGGED, carried over: the brief specified only the Layer 1 label for
      # axioms. Layers 2 and 3 are a choice -- a distinct flavor with a
      # distinct label triple. Reusing the kernel labels is equally safe
      # (app.js reads no layer strings today); confirm which you want.
      meta: META_DEBATE

  ops:
    graph_key: ops
    pane: right
    layer_by_flavor:
      kernel: OPERATIONAL_EXTENSIONS
      policy: EXECUTION_CHECKLIST
      meta: META_CHECKLIST

  evi:
    # NEW ARRAY. app.js does not read `evidence` yet, so entries compile and
    # are indexed but do not render. Additive: nothing breaks until it does.
    graph_key: evidence
    pane: right
    layer_by_flavor:
      # FLAGGED: these three labels are my choice, not from any brief. The
      # naming follows the existing pairs (TECHNICAL_* for kernel,
      # execution/compliance wording for policy). Rename freely before the
      # frontend starts reading them -- after that they are a public
      # contract.
      kernel: TECHNICAL_EVIDENCE
      policy: COMPLIANCE_EVIDENCE
      meta: META_EVIDENCE

# Document lifecycle projection (Task 2). Declares what the frontend should
# render for the new frontmatter fields. Nothing reads this yet — it is the
# contract app.js must implement to make the deprecation banner mechanical
# instead of inline-text-driven.
lifecycle:
  superseded_by:
    pane: middle
    render: deprecation_banner
    banner_severity: warning
    link_target: document_id
    notes: >-
      When non-null, render a banner above the contract body linking to the
      named document_id. See 01-AUDIT-FINDINGS.md FINDING 4 — document_id is
      not globally unique across tractates and this reference is NOT validated
      by the linter, so a dangling link is currently possible.
  supersedes:
    pane: middle
    render: provenance_line
    banner_severity: info
    link_target: document_id